block.logistics-network-logistics-base.name = Logistics Base
block.logistics-network-logistics-base.description = The core of the logistics network. While powered, it produces logistics drones that carry items between supply points, request points and storage points. Drones disappear when this base is destroyed. Low power levels slow down the base's drones.
block.logistics-network-logistics-supply-point.name = Supply Point
block.logistics-network-logistics-supply-point.description = Items placed inside are picked up by logistics drones and taken where they are needed.
block.logistics-network-logistics-request-point.name = Request Point
block.logistics-network-logistics-request-point.description = Tap to choose an item: logistics drones will keep bringing it until this chest is full.
block.logistics-network-logistics-storage-point.name = Storage Point
block.logistics-network-logistics-storage-point.description = Logistics drones store excess items here, and take items from here first when a request needs them.
unit.logistics-network-logistics-bot.name = Logistics Drone
unit.logistics-network-logistics-bot.description = A flying robot that transports items between logistics buildings. Produced by logistics bases.
bar.progress = Progress
bar.logistics-bots = Drones: {0}/{1}
logistics.priority = Priority
