block.logistics-network-logistics-base.name = 物流基站
block.logistics-network-logistics-base.description = 物流网络的核心。通电后生成物流机器人，在供应点、请求点与储存点之间运输货物。基站被拆除时，对应无人机会消失。\n 供电水平降低会导致基站无人机速度降低。\n 超频会增加物流无人机移动速度，增加比例为超频比例的一半
block.logistics-network-logistics-supply-point.name = 供应点
block.logistics-network-logistics-supply-point.description = 放入其中的物品会被物流无人机取走，送往需要它们的地方。
block.logistics-network-logistics-request-point.name = 请求点
block.logistics-network-logistics-request-point.description = 点击选择需要的物品，物流无人机会持续将这种物品运来，直到箱子装满。
block.logistics-network-logistics-storage-point.name = 储存点
block.logistics-network-logistics-storage-point.description = 物流无人机会把多余的物品存放在这里；当请求需要时，优先这里取货。
unit.logistics-network-logistics-bot.name = 物流无人机
unit.logistics-network-logistics-bot.description = 在物流建筑之间运输货物的飞行机器人，由物流基站生成。
bar.progress = 进度
bar.logistics-bots = 无人机：{0}/{1}
logistics.priority = 优先级
